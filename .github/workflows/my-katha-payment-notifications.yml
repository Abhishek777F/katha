name: My Katha Payment Notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-katha-payment-notifications
  cancel-in-progress: false

jobs:
  payment-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Check notification script
        run: test -f scripts/payment-notifications.js

      - name: Poll new payments and send notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/payment-notifications.js

name: Khata Balance Reminders

on:
  schedule:
    - cron: "30 3 7,14,21,28 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-balance-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Check reminder script
        run: |
          if [ ! -f scripts/balance-reminders.js ]; then
            echo "Reminder script has not been created yet."
            exit 1
          fi

      - name: Run balance reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/balance-reminders.js
